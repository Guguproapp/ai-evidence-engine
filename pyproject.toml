[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evidence-engine"
version = "0.1.0"
description = "Local-first provenance passports, event chains, and text DNA verification."
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

